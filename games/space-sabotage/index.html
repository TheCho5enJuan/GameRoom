<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>SPACE SABOTAGE</title>
<script src="https://cdn.tailwindcss.com"></script>

<link href="./css/game.css" rel="stylesheet"/></head>
<body>
<!-- SVG Fingerprint -->
<svg fill="none" height="36" id="fingerprint-template" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" style="display:none;" viewbox="0 0 24 24" width="36" xmlns="http://www.w3.org/2000/svg">
<path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"></path>
<path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path>
<path d="M8.5 19.5c.3-1.5.5-4 .5-7.5a3 3 0 0 1 5.34-2"></path>
<path d="M12 19.5c.2-1.5.5-4 .5-7.5"></path>
<path d="M15.5 19.5c.1-1.5.2-3 .2-4.5"></path>
<path d="M19 19.5c0-1.5-.5-5-2-7.5"></path>
<path d="M12 22v-2"></path>
<path d="M8 22v-2"></path>
<path d="M16 22v-2"></path>
<path d="M5 4.5a10 10 0 0 1 14 0"></path>
<path d="M8.5 7a7 7 0 0 1 7 0"></path>
</svg>
<!-- Quadrants (Tabletop Mode) -->
<div class="quadrant q-tl" id="quad-0"><div class="anchor-wrapper" data-q="0"><div class="player-label">P1</div><div class="anchor-zone"><div class="anchor-icon"></div></div></div><div class="hidden-menu" id="menu-0"></div></div>
<div class="quadrant q-tr" id="quad-1"><div class="anchor-wrapper" data-q="1"><div class="player-label">P2</div><div class="anchor-zone"><div class="anchor-icon"></div></div></div><div class="hidden-menu" id="menu-1"></div></div>
<div class="quadrant q-bl" id="quad-2"><div class="anchor-wrapper flex-col-reverse" data-q="2"><div class="player-label">P3</div><div class="anchor-zone"><div class="anchor-icon"></div></div></div><div class="hidden-menu" id="menu-2"></div></div>
<div class="quadrant q-br" id="quad-3"><div class="anchor-wrapper flex-col-reverse" data-q="3"><div class="player-label">P4</div><div class="anchor-zone"><div class="anchor-icon"></div></div></div><div class="hidden-menu" id="menu-3"></div></div>
<!-- Center Console -->
<div id="center-console">
<div class="w-full flex flex-col items-center justify-center" id="ui-content"></div>
</div>
<!-- Pass & Play UI (Outside Center Console) -->
<div id="pass-play-ui" style="display: none;">
<!-- Menu pops up at the TOP of the screen -->
<div class="hidden-menu top-center-menu" id="pass-menu"></div>
<!-- Scanner sits at the BOTTOM of the screen -->
<div class="anchor-wrapper pass-mode-anchor bottom-center-scanner" data-q="0" id="pass-anchor">
<div class="player-label mb-2 text-xl" id="pass-player-label">P1</div>
<div class="anchor-zone" style="width: 80px; height: 80px;">
<div class="anchor-icon" style="width: 75px; height: 75px; border-color: rgba(0,243,255,0.6); color: rgba(0,243,255,0.6); box-shadow: inset 0 0 10px rgba(0,243,255,0.2);"></div>
</div>
</div>
</div>

<script src="./js/audio.js"></script><script src="./js/game-state.js"></script><script src="./js/game-flow.js"></script><script src="./js/game-ui.js"></script><script src="./js/input.js"></script><script src="./js/main.js"></script></body>
</html>
