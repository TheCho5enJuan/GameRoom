name: Rebuild GameRoom projects

on:
  push:
    branches: [rebuild-game-projects]
    paths:
      - '.rebuild/**'
      - '.github/workflows/rebuild-games.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare rebuild tools and source files
        shell: bash
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE/.rebuild/work"
          src="$work/source"
          mkdir -p "$src"

          cat .rebuild/build-part-* | base64 -d | gzip -d > "$work/build_projects.py"
          base64 -d < .rebuild/analyze.gz.b64 | gzip -d > "$work/analyze_js.py"
          base64 -d < .rebuild/object.gz.b64 | gzip -d > "$work/object_props.py"
          base64 -d < .rebuild/smoke.gz.b64 | gzip -d > "$work/smoke.mjs"

          echo '256a21dffc0b52ea2cbf793b2a1e20a2a5dd0ccdd2f89b9e3bbcc609aa0cf9f8  .rebuild/work/build_projects.py' | sha256sum -c -
          echo '2f3674f9a0cbec2da6393231b74986c93984ed04723fde11a1262b2a95be289e  .rebuild/work/analyze_js.py' | sha256sum -c -
          echo '4a7abaf63d754cbb84a88ee2d5b3884b0b658ad63687493012387e47889316c8  .rebuild/work/object_props.py' | sha256sum -c -
          echo '96eafddfb91e8f7d998532cd1f85be75b2091ecf31e13759f6f59f0879c9b323  .rebuild/work/smoke.mjs' | sha256sum -c -

          cat .game-upload/blockforge.00 .game-upload/blockforge.01 .game-upload/blockforge.02 .game-upload/blockforge.03 \
            | base64 -d | gzip -d > "$src/blockforge_clicker_v5_3d.html"

          cat .game-upload/tidexz.00 .game-upload/tidexz.01 .game-upload/tidexz.02 .game-upload/tidexz.03 \
              .game-upload/tidexz.04 .game-upload/tidexz.05 .game-upload/tidexz.06 .game-upload/tidexz.07 \
              .game-upload/tidexz.08 .game-upload/tidexz.09 .game-upload/tidexz.10 .game-upload/tidexz.11 \
            | base64 -d | xz -d > "$src/TideAndTranquility_Professional_v10_1.html"

          base64 -d < .game-upload/space.gz.b64 | gzip -d > "$src/Space Sabotage.html"
          base64 -d < .game-upload/deal.gz.b64 | gzip -d > "$src/dealornodeal.txt"
          base64 -d < .game-upload/tictac.gz.b64 | gzip -d > "$src/ticktacktoe.html"

          echo '8f38f85d9cf8b770a511879757921e529cba70a03c25b48393a9fcc4294f016a  .rebuild/work/source/blockforge_clicker_v5_3d.html' | sha256sum -c -
          echo '7f7ebbb7062b6b0318393df69a9894230403de9548b1472793ea953d6880137c  .rebuild/work/source/TideAndTranquility_Professional_v10_1.html' | sha256sum -c -
          echo '0368f87a6844c47b4f7e6496ceb573a814bc85c19d798c17cc34a1136dbfd404  .rebuild/work/source/Space Sabotage.html' | sha256sum -c -
          echo 'e8f97cb613160d0c31e3277ca1ded1b1a8c3972d89aea9b51ac29870861543b3  .rebuild/work/source/dealornodeal.txt' | sha256sum -c -
          echo 'f466e3ea19fd84343ed7b7555c25c581843829f42ff95e6c5092cb3c81d3f94f  .rebuild/work/source/ticktacktoe.html' | sha256sum -c -

          python -m pip install --disable-pip-version-check beautifulsoup4
          git fetch origin modular-game-builds:refs/remotes/origin/modular-game-builds
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import re, subprocess

          root = Path('.rebuild/work')
          src = root / 'source'

          def show(path):
              return subprocess.check_output(
                  ['git', 'show', f'origin/modular-game-builds:{path}'],
                  text=True,
              )

          html = show('games/rogue-quest/index.html')
          soup = BeautifulSoup(html, 'html.parser')
          for link in list(soup.find_all('link', href=True)):
              if str(link.get('href', '')).startswith('./'):
                  link.extract()
          for script in list(soup.find_all('script', src=True)):
              if str(script.get('src', '')).startswith('./'):
                  script.extract()

          css = show('games/rogue-quest/css/game.css')
          js_parts = []
          for number in range(1, 5):
              text = show(f'games/rogue-quest/js/game-{number:02d}.js')
              text = re.sub(r'^\s*[\'\"]use strict[\'\"];\s*', '', text, count=1)
              js_parts.append(text)

          style = soup.new_tag('style')
          style.string = css
          soup.head.append(style)
          script = soup.new_tag('script')
          script.string = '\n'.join(js_parts)
          soup.body.append(script)
          output = '<!doctype html>\n' + str(soup).replace('<!DOCTYPE html>', '').replace('<!doctype html>', '').lstrip()
          (src / 'RogueQuest_Production_v3_1.html').write_text(output, encoding='utf-8')
          PY

      - name: Generate maintainable game projects
        shell: bash
        run: |
          set -euo pipefail
          python .rebuild/work/build_projects.py
          cp .rebuild/work/smoke.mjs .rebuild/work/site/tests/smoke.mjs
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          root = Path('.rebuild/work/site')
          readme = root.joinpath('README.md')
          text = readme.read_text(encoding='utf-8')
          if 'node tests/smoke.mjs' not in text:
              text = text.replace('node tests/validate.mjs\n```', 'node tests/validate.mjs\nnode tests/smoke.mjs\n```')
          readme.write_text(text, encoding='utf-8')
          root.joinpath('.github/workflows/validate.yml').write_text(dedent('''\
          name: Validate GameRoom

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: node tests/validate.mjs
                - run: node tests/smoke.mjs
          '''), encoding='utf-8')
          PY

          cd .rebuild/work/site
          node tests/validate.mjs
          node tests/smoke.mjs

      - name: Replace legacy repository with rebuilt projects
        shell: bash
        run: |
          set -euo pipefail
          site="$GITHUB_WORKSPACE/.rebuild/work/site"
          temp="$(mktemp -d)"
          cp -a "$site/." "$temp/"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$temp/." "$GITHUB_WORKSPACE/"
          rm -rf "$temp"

      - name: Commit rebuilt GameRoom
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github
          git restore --source=HEAD --staged --worktree .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild all GameRoom games as maintainable projects'
          git push origin HEAD:rebuild-game-projects
